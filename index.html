<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 비밀 공책들</title>
    <style>
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            font-family: 'Malgun Gothic', sans-serif;
            color: #333;
            box-sizing: border-box;
            gap: 20px;
        }

        /* 왼쪽 공책 목록 사이드바 */
        .sidebar {
            width: 220px;
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            color: #fff;
            flex-shrink: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .sidebar h2 {
            font-size: 18px;
            margin: 0;
            color: #e2e8f0;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .sidebar h2:hover {
            color: #3498db;
        }

        .edit-title-btn {
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 13px;
            padding: 0 0 0 5px;
        }

        .edit-title-btn:hover {
            color: #fff;
        }

        .book-list {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            max-height: 500px;
            overflow-y: auto;
        }

        .book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 6px;
            background: #2a2a2a;
            font-size: 14px;
            transition: background 0.2s;
        }

        .book-item:hover {
            background: #3a3a3a;
        }

        .book-item.active {
            background: #3498db;
            font-weight: bold;
        }

        .book-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .book-del-btn {
            background: none;
            border: none;
            color: #ff8b8b;
            cursor: pointer;
            font-size: 12px;
            padding: 0 0 0 8px;
            display: none;
        }

        .book-item:hover .book-del-btn {
            display: inline;
        }

        .add-book-btn {
            width: 100%;
            padding: 10px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .add-book-btn:hover {
            background: #219150;
        }

        /* 오른쪽 공책 메인 화면 */
        .notebook {
            position: relative;
            width: 750px;
            min-height: 800px;
            height: auto;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            padding: 50px 50px 50px 85px;
            background-image: linear-gradient(#e1e8ed 1px, transparent 1px);
            background-size: 100% 32px;
            line-height: 32px;
            box-sizing: border-box;
        }

        .notebook::before {
            content: '';
            position: absolute;
            top: 0;
            left: 65px;
            width: 2px;
            height: 100%;
            background-color: #ff8b8b;
        }

        .holes {
            position: absolute;
            left: 20px;
            top: 40px;
            bottom: 40px;
            width: 20px;
            background-image: radial-gradient(circle 10px at 10px 10px, #121212 99%, transparent 100%);
            background-size: 20px 160px;
            background-repeat: repeat-y;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            height: 32px;
        }

        h1 {
            margin: 0;
            color: #2c3e50;
            font-size: 24px;
            line-height: 32px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 450px;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .batch-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
            padding: 3px 10px;
            cursor: pointer;
            color: #e74c3c;
            border-color: #feb2b2;
            background-color: #fff5f5;
        }
        .batch-btn:hover { background-color: #fed7d7; }

        .search-box {
            height: 32px;
            margin-bottom: 16px;
        }
        .search-input {
            width: 100%;
            border: none;
            border-bottom: 1px dashed #a0aec0;
            background: transparent;
            font-size: 16px;
            outline: none;
            height: 32px;
            color: #4a5568;
        }

        .memo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .memo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #333;
            height: 32px;
            line-height: 32px;
            gap: 10px;
            margin: 0;
            padding: 0;
        }

        .memo-checkbox {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #e74c3c;
            flex-shrink: 0;
        }

        .memo-content {
            cursor: pointer;
            flex: 1;
            font-size: 19px;
            line-height: 32px;
            height: 32px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            margin: 0;
            padding: 0;
        }

        .memo-content div, .memo-content p, .edit-editor div, .edit-editor p {
            margin: 0 !important;
            padding: 0 !important;
            line-height: 32px !important;
            height: 32px !important;
        }

        /* 서식 클래스 */
        .size-s { font-size: 15px !important; }
        .size-m { font-size: 19px !important; }
        .size-l { font-size: 25px !important; font-weight: bold !important; }
        
        .style-red-ul { 
            text-decoration: underline #e74c3c 2px !important; 
            text-underline-offset: 4px !important; 
        }
        
        .hl-y { background-color: #fff176 !important; border-radius: 2px; padding: 0 2px; }
        .hl-g { background-color: #a5d6a7 !important; border-radius: 2px; padding: 0 2px; }
        .hl-p { background-color: #ef9a9a !important; border-radius: 2px; padding: 0 2px; }

        .edit-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        .edit-editor {
            width: 100%;
            border-bottom: 2px solid #3498db;
            outline: none;
            height: 32px;
            line-height: 32px;
            font-size: 19px;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.6;
            padding: 0 5px;
            flex-shrink: 0;
        }
        .delete-btn:hover { opacity: 1; }

        /* 입력 영역 구조 */
        .input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            margin-top: 16px;
        }

        .memo-editor {
            width: 100%;
            border: none;
            border-bottom: 1px solid #cbd5e1;
            background: transparent;
            font-size: 19px;
            outline: none;
            height: 32px;
            line-height: 32px;
            color: #2c3e50;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .memo-editor:empty:before {
            content: attr(placeholder);
            color: #a0aec0;
            font-size: 16px;
        }

        .toolbar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .inline-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f8fafc;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .tool-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 12px;
            padding: 3px 8px;
            cursor: pointer;
            color: #475569;
            line-height: 1.2;
            white-space: nowrap;
        }
        .tool-btn:hover { background: #f1f5f9; }
        .tool-btn.clear-btn {
            background: #fff5f5;
            border-color: #feb2b2;
            color: #c53030;
        }
        .tool-btn.clear-btn:hover { background: #fed7d7; }

        .add-btn {
            background: #3498db;
            color: white;
            border: none;
            font-weight: bold;
            padding: 5px 14px;
            height: 32px;
        }
        .add-btn:hover { background: #2980b9; }
    </style>
</head>
<body>

    <!-- 왼쪽 사이드바 (공책 목록) -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2 id="appTitle" onclick="changeAppTitle()" title="클릭하여 타이틀 변경">📚 내 공책 목록</h2>
            <button class="edit-title-btn" onclick="changeAppTitle()" title="타이틀 수정">✏️</button>
        </div>
        <ul id="bookList" class="book-list"></ul>
        <button class="add-book-btn" onclick="createNewBook()">+ 새 공책 만들기</button>
    </div>

    <!-- 오른쪽 메인 공책 -->
    <div class="notebook">
        <div class="holes"></div>

        <div class="header-area">
            <h1 id="notebookTitle">📝 기본 공책</h1>
            <div class="action-btns">
                <button class="batch-btn" onclick="deleteSelectedMemos()">☑️ 선택 삭제</button>
                <button class="batch-btn" onclick="clearAllMemos()">🗑️ 전체 삭제</button>
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 공책 내용 검색..." oninput="renderMemos()">
        </div>

        <ul id="memoList" class="memo-list"></ul>

        <!-- 입력 부분 -->
        <div class="input-row" id="inputLine">
            <div id="memoInput" class="memo-editor" contenteditable="true" placeholder="작성할 내용을 입력하세요..."></div>
            <div class="toolbar-container">
                <div class="inline-toolbar">
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('size-l');">크게</button>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('size-m');">보통</button>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('size-s');">작게</button>
                    <span style="color:#ccc;">|</span>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('hl-y');">🟨</button>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('hl-g');">🟩</button>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('hl-p');">🟥</button>
                    <button class="tool-btn clear-btn" onmousedown="event.preventDefault(); clearStyle('highlight');" title="형광펜 지우기">🧹</button>
                    <span style="color:#ccc;">|</span>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('style-red-ul');"><span style="color:#e74c3c; text-decoration:underline;">밑줄</span></button>
                    <button class="tool-btn clear-btn" onmousedown="event.preventDefault(); clearStyle('underline');" title="밑줄 지우기">🧹</button>
                </div>
                <button class="tool-btn add-btn" onclick="addMemo()">작성 완료</button>
            </div>
        </div>
    </div>

    <script>
        let currentEditingIndex = -1;
        let currentBookId = "default";

        document.addEventListener("DOMContentLoaded", function() {
            loadAppTitle();
            initBooks();
            document.getElementById("memoInput").addEventListener("keydown", function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    addMemo();
                }
            });
        });

        // 앱 타이틀 관리
        function loadAppTitle() {
            const savedTitle = localStorage.getItem("myNotebook_appTitle");
            if (savedTitle) {
                document.getElementById("appTitle").innerText = savedTitle;
                document.title = savedTitle;
            }
        }

        function changeAppTitle() {
            const currentTitle = document.getElementById("appTitle").innerText;
            const newTitle = prompt("메인 제목을 입력하세요:", currentTitle);
            if (newTitle && newTitle.trim()) {
                const trimmed = newTitle.trim();
                document.getElementById("appTitle").innerText = trimmed;
                document.title = trimmed;
                localStorage.setItem("myNotebook_appTitle", trimmed);
            }
        }

        // 공책 데이터 관리
        function getAllBooks() {
            const saved = localStorage.getItem("myNotebook_books");
            if (!saved) {
                return { "default": { title: "기본 공책", memos: [] } };
            }
            return JSON.parse(saved);
        }

        function saveAllBooks(books) {
            localStorage.setItem("myNotebook_books", JSON.stringify(books));
        }

        function initBooks() {
            const books = getAllBooks();
            if (!books[currentBookId]) {
                currentBookId = Object.keys(books)[0] || "default";
            }
            renderBookList();
            renderMemos();
        }

        function createNewBook() {
            const title = prompt("새 공책의 이름을 입력하세요:", "새 공책");
            if (!title || !title.trim()) return;

            const books = getAllBooks();
            const newId = "book_" + Date.now();
            books[newId] = { title: title.trim(), memos: [] };
            saveAllBooks(books);

            currentBookId = newId;
            renderBookList();
            renderMemos();
        }

        function switchBook(bookId) {
            currentBookId = bookId;
            currentEditingIndex = -1;
            renderBookList();
            renderMemos();
        }

        function deleteBook(bookId, event) {
            event.stopPropagation();
            const books = getAllBooks();
            const bookKeys = Object.keys(books);

            if (bookKeys.length <= 1) {
                alert("최소 하나의 공책은 남아있어야 합니다.");
                return;
            }

            if (confirm(`'${books[bookId].title}' 공책을 삭제하시겠습니까? 안의 내용도 모두 삭제됩니다.`)) {
                delete books[bookId];
                saveAllBooks(books);

                if (currentBookId === bookId) {
                    currentBookId = Object.keys(books)[0];
                }
                renderBookList();
                renderMemos();
            }
        }

        function renderBookList() {
            const books = getAllBooks();
            const list = document.getElementById("bookList");
            list.innerHTML = "";

            Object.keys(books).forEach(id => {
                const book = books[id];
                const li = document.createElement("li");
                li.className = `book-item ${id === currentBookId ? 'active' : ''}`;
                li.onclick = () => switchBook(id);

                li.innerHTML = `
                    <span class="book-name">📖 ${book.title}</span>
                    <button class="book-del-btn" onclick="deleteBook('${id}', event)">✕</button>
                `;
                list.appendChild(li);
            });

            document.getElementById("notebookTitle").innerText = `📝 ${books[currentBookId].title}`;
        }

        function getSavedMemos() {
            const books = getAllBooks();
            return books[currentBookId] ? books[currentBookId].memos : [];
        }

        function saveMemos(memos) {
            const books = getAllBooks();
            if (books[currentBookId]) {
                books[currentBookId].memos = memos;
                saveAllBooks(books);
            }
        }

        // 서식 적용 관련 함수들
        function applyStyle(className) {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;

            const range = selection.getRangeAt(0);
            const span = document.createElement("span");
            span.className = className;
            span.textContent = range.toString();

            range.deleteContents();
            range.insertNode(span);
            selection.removeAllRanges();
        }

        function clearStyle(type) {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;

            const range = selection.getRangeAt(0);
            const container = range.commonAncestorContainer.parentElement;

            if (container && container.tagName === 'SPAN') {
                if (type === 'highlight' && (container.classList.contains('hl-y') || container.classList.contains('hl-g') || container.classList.contains('hl-p'))) {
                    removeSpanKeepText(container);
                } else if (type === 'underline' && container.classList.contains('style-red-ul')) {
                    removeSpanKeepText(container);
                }
            }
            selection.removeAllRanges();
        }

        function removeSpanKeepText(spanElement) {
            const textNode = document.createTextNode(spanElement.textContent);
            spanElement.parentNode.replaceChild(textNode, spanElement);
        }

        // 메모 추가 / 삭제 / 수정
        function addMemo() {
            if (currentEditingIndex !== -1) {
                saveEdit(currentEditingIndex);
            }

            const input = document.getElementById("memoInput");
            let htmlContent = input.innerHTML;
            
            if (!htmlContent || htmlContent === '<br>') return;

            htmlContent = htmlContent.replace(/<div>/gi, '<br>').replace(/<\/div>/gi, '')
                                     .replace(/<p>/gi, '<br>').replace(/<\/p>/gi, '');

            const lines = htmlContent.split(/<br\s*[\/]?>/gi);
            const memos = getSavedMemos();

            lines.forEach(line => {
                const cleanedLine = line.trim();
                memos.push(cleanedLine === '' || cleanedLine === '&nbsp;' ? '&nbsp;' : cleanedLine);
            });

            saveMemos(memos);
            input.innerHTML = "";
            renderMemos();
        }

        function deleteMemo(index) {
            const memos = getSavedMemos();
            memos.splice(index, 1);
            saveMemos(memos);
            
            if (currentEditingIndex === index) {
                currentEditingIndex = -1;
            }
            renderMemos();
        }

        function deleteSelectedMemos() {
            const checkboxes = document.querySelectorAll(".memo-checkbox:checked");
            if (checkboxes.length === 0) {
                alert("삭제할 항목을 선택해주세요.");
                return;
            }

            if (!confirm(`선택한 ${checkboxes.length}개 항목을 삭제하시겠습니까?`)) return;

            const indexesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index));
            let memos = getSavedMemos();

            indexesToDelete.sort((a, b) => b - a);
            indexesToDelete.forEach(index => {
                memos.splice(index, 1);
            });

            saveMemos(memos);
            currentEditingIndex = -1;
            renderMemos();
        }

        function clearAllMemos() {
            const memos = getSavedMemos();
            if (memos.length === 0) {
                alert("삭제할 메모가 없습니다.");
                return;
            }

            if (confirm("현재 공책의 모든 메모를 삭제하시겠습니까?")) {
                saveMemos([]);
                currentEditingIndex = -1;
                renderMemos();
            }
        }

        function editMemo(index) {
            if (currentEditingIndex === index) return;

            if (currentEditingIndex !== -1) {
                saveEdit(currentEditingIndex);
            }

            currentEditingIndex = index;
            renderMemos();
        }

        function saveEdit(index) {
            const editInput = document.getElementById(`editInput-${index}`);
            if (!editInput) return;
            
            let newHtml = editInput.innerHTML.trim();
            const memos = getSavedMemos();

            if (!newHtml || newHtml === '<br>') {
                newHtml = '&nbsp;';
            }

            memos[index] = newHtml;
            saveMemos(memos);

            currentEditingIndex = -1;
            renderMemos();
        }

        function renderMemos() {
            const list = document.getElementById("memoList");
            list.innerHTML = "";
            const memos = getSavedMemos();
            const keyword = document.getElementById("searchInput").value.toLowerCase();

            memos.forEach((itemHtml, index) => {
                const tempDiv = document.createElement("div");
                tempDiv.innerHTML = itemHtml;
                const plainText = tempDiv.textContent || tempDiv.innerText || "";

                if (keyword && !plainText.toLowerCase().includes(keyword)) {
                    return;
                }

                const li = document.createElement("li");
                li.className = "memo-item";
                li.id = `memo-${index}`;
                
                if (index === currentEditingIndex) {
                    const displayValue = (itemHtml === '&nbsp;') ? '' : itemHtml;
                    li.innerHTML = `
                        <div class="edit-box">
                            <div class="edit-editor" id="editInput-${index}" contenteditable="true">${displayValue}</div>
                            <div class="toolbar-container">
                                <div class="inline-toolbar">
                                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('size-l');">크게</button>
                                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('size-m');">보통</button>
                                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('size-s');">작게</button>
                                    <span style="color:#ccc;">|</span>
                                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('hl-y');">🟨</button>
                                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('hl-g');">🟩</button>
                                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('hl-p');">🟥</button>
                                    <button class="tool-btn clear-btn" onmousedown="event.preventDefault(); clearStyle('highlight');" title="형광펜 지우기">🧹</button>
                                    <span style="color:#ccc;">|</span>
                                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('style-red-ul');"><span style="color:#e74c3c; text-decoration:underline;">밑줄</span></button>
                                    <button class="tool-btn clear-btn" onmousedown="event.preventDefault(); clearStyle('underline');" title="밑줄 지우기">🧹</button>
                                </div>
                                <button class="delete-btn" onclick="saveEdit(${index})" style="font-size:16px; font-weight:bold;">✔ 저장</button>
                            </div>
                        </div>
                    `;
                    setTimeout(() => {
                        const editInput = document.getElementById(`editInput-${index}`);
                        if (editInput) editInput.focus();
                    }, 0);
                } else {
                    const isBlank = (itemHtml === '&nbsp;');
                    const contentDisplay = isBlank ? '' : itemHtml;
                    
                    li.innerHTML = `
                        <input type="checkbox" class="memo-checkbox" data-index="${index}">
                        <div class="memo-content" onclick="editMemo(${index})" title="클릭해서 수정">${contentDisplay}</div>
                        <button class="delete-btn" onclick="deleteMemo(${index})">✕</button>
                    `;
                }
                
                list.appendChild(li);
            });

            const inputLine = document.getElementById("inputLine");
            if (keyword) {
                inputLine.style.display = "none";
            } else {
                inputLine.style.display = "flex";
            }
        }
    </script>

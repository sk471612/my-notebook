<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 비밀 공책들</title>
    <style>
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            font-family: 'Malgun Gothic', sans-serif;
            color: #333;
            box-sizing: border-box;
            gap: 20px;
        }

        /* 왼쪽 사이드바 */
        .sidebar {
            width: 200px;
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            color: #fff;
            flex-shrink: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .sidebar h2 {
            font-size: 16px;
            margin: 0;
            color: #e2e8f0;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .sidebar h2:hover { color: #3498db; }

        .edit-title-btn {
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 13px;
            padding: 0 0 0 5px;
        }

        .book-list {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            max-height: 500px;
            overflow-y: auto;
        }

        .book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 6px;
            background: #2a2a2a;
            font-size: 14px;
            transition: background 0.2s;
        }

        .book-item:hover { background: #3a3a3a; }
        .book-item.active { background: #3498db; font-weight: bold; }

        .book-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .book-del-btn {
            background: none;
            border: none;
            color: #ff8b8b;
            cursor: pointer;
            font-size: 12px;
            padding: 0 0 0 8px;
            display: none;
        }

        .book-item:hover .book-del-btn { display: inline; }

        .add-book-btn {
            width: 100%;
            padding: 10px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        /* 메인 공책 바인더 (2쪽) */
        .notebook-container {
            width: 1100px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            padding: 30px 40px;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 12px;
        }

        h1 {
            margin: 0;
            color: #2c3e50;
            font-size: 22px;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .batch-btn {
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 4px;
            font-size: 13px;
            padding: 5px 12px;
            cursor: pointer;
            color: #e74c3c;
        }
        .batch-btn:hover { background-color: #fed7d7; }

        .search-input {
            width: 100%;
            border: none;
            border-bottom: 1px dashed #a0aec0;
            background: transparent;
            font-size: 15px;
            outline: none;
            height: 32px;
            margin-bottom: 15px;
        }

        /* 2쪽 펼침 컨트롤 및 레이아웃 */
        .page-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: #f8fafc;
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .page-nav-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 13px;
            color: #334155;
            font-weight: bold;
        }
        .page-nav-btn:hover:not(:disabled) { background: #e2e8f0; }
        .page-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .page-indicator {
            font-size: 14px;
            font-weight: bold;
            color: #475569;
        }

        .pages-wrapper {
            display: flex;
            gap: 0;
            position: relative;
            background: #fff;
            min-height: 480px;
        }

        /* 중앙 바인더 링 */
        .pages-wrapper::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 10px;
            transform: translateX(-50%);
            background: linear-gradient(to right, #cbd5e1, #94a3b8, #cbd5e1);
            border-radius: 5px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .page {
            flex: 1;
            padding: 10px 25px;
            background-image: linear-gradient(#e1e8ed 1px, transparent 1px);
            background-size: 100% 32px;
            line-height: 32px;
            box-sizing: border-box;
            position: relative;
        }

        .page-left {
            border-right: 1px solid #e2e8f0;
            padding-right: 35px;
        }

        .page-right {
            padding-left: 35px;
        }

        .memo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .memo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 32px;
            line-height: 32px;
            gap: 8px;
        }

        .memo-checkbox {
            cursor: pointer;
            width: 15px;
            height: 15px;
            accent-color: #e74c3c;
            flex-shrink: 0;
        }

        .memo-content {
            cursor: pointer;
            flex: 1;
            font-size: 18px;
            line-height: 32px;
            height: 32px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        /* 서식 스타일 */
        .size-s { font-size: 14px !important; }
        .size-m { font-size: 18px !important; }
        .size-l { font-size: 22px !important; font-weight: bold !important; }
        
        .style-red-ul { text-decoration: underline #e74c3c 2px !important; text-underline-offset: 4px !important; }
        .hl-y { background-color: #fff176 !important; border-radius: 2px; padding: 0 2px; }
        .hl-g { background-color: #a5d6a7 !important; border-radius: 2px; padding: 0 2px; }
        .hl-p { background-color: #ef9a9a !important; border-radius: 2px; padding: 0 2px; }

        .edit-box { display: flex; align-items: center; gap: 8px; width: 100%; }
        .edit-editor {
            flex: 1;
            border-bottom: 2px solid #3498db;
            outline: none;
            height: 32px;
            line-height: 32px;
            font-size: 18px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.6;
            flex-shrink: 0;
        }
        .delete-btn:hover { opacity: 1; }

        /* 하단 입력 영역 */
        .bottom-input-area {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .memo-editor {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px 12px;
            background: #fafafa;
            font-size: 16px;
            outline: none;
            min-height: 40px;
            line-height: 24px;
            box-sizing: border-box;
        }
        .memo-editor:empty:before {
            content: attr(placeholder);
            color: #a0aec0;
        }

        .toolbar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inline-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f8fafc;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .tool-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 12px;
            padding: 3px 8px;
            cursor: pointer;
            color: #475569;
        }
        .tool-btn:hover { background: #f1f5f9; }
        .tool-btn.clear-btn { background: #fff5f5; border-color: #feb2b2; color: #c53030; }

        .add-btn {
            background: #3498db;
            color: white;
            border: none;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 6px;
            cursor: pointer;
        }
        .add-btn:hover { background: #2980b9; }
    </style>
</head>
<body>

    <!-- 사이드바 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2 id="appTitle" onclick="changeAppTitle()">📚 내 공책 목록</h2>
            <button class="edit-title-btn" onclick="changeAppTitle()">✏️</button>
        </div>
        <ul id="bookList" class="book-list"></ul>
        <button class="add-book-btn" onclick="createNewBook()">+ 새 공책 만들기</button>
    </div>

    <!-- 2쪽 메인 공책 -->
    <div class="notebook-container">
        <div class="top-bar">
            <h1 id="notebookTitle">📝 기본 공책</h1>
            <div class="action-btns">
                <button class="batch-btn" onclick="deleteSelectedMemos()">☑️ 선택 삭제</button>
                <button class="batch-btn" onclick="clearAllMemos()">🗑️ 전체 삭제</button>
            </div>
        </div>

        <input type="text" id="searchInput" class="search-input" placeholder="🔍 내용 검색..." oninput="renderMemos()">

        <!-- 페이지 이동 네비게이션 -->
        <div class="page-navigation">
            <button id="prevPageBtn" class="page-nav-btn" onclick="prevPage()">〈 이전 페이지</button>
            <span id="pageIndicator" class="page-indicator">Page 1-2</span>
            <button id="nextPageBtn" class="page-nav-btn" onclick="nextPage()">다음 페이지 〉</button>
        </div>

        <!-- 좌우 2쪽 펼침 영역 -->
        <div class="pages-wrapper">
            <div class="page page-left">
                <ul id="memoListLeft" class="memo-list"></ul>
            </div>
            <div class="page page-right">
                <ul id="memoListRight" class="memo-list"></ul>
            </div>
        </div>

        <!-- 하단 작성 영역 -->
        <div class="bottom-input-area" id="inputLine">
            <div id="memoInput" class="memo-editor" contenteditable="true" placeholder="작성할 내용을 입력하세요..."></div>
            <div class="toolbar-container">
                <div class="inline-toolbar">
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('size-l');">크게</button>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('size-m');">보통</button>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('size-s');">작게</button>
                    <span style="color:#ccc;">|</span>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('hl-y');">🟨</button>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('hl-g');">🟩</button>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('hl-p');">🟥</button>
                    <button class="tool-btn clear-btn" onmousedown="event.preventDefault(); clearStyle('highlight');">🧹</button>
                    <span style="color:#ccc;">|</span>
                    <button class="tool-btn" onmousedown="event.preventDefault(); applyStyle('style-red-ul');"><span style="color:#e74c3c; text-decoration:underline;">밑줄</span></button>
                    <button class="tool-btn clear-btn" onmousedown="event.preventDefault(); clearStyle('underline');">🧹</button>
                </div>
                <button class="add-btn" onclick="addMemo()">작성 완료</button>
            </div>
        </div>
    </div>

    <script>
        let currentEditingIndex = -1;
        let currentBookId = "default";
        let currentPageGroup = 0; // 0: 1-2쪽, 1: 3-4쪽 ...
        const LINES_PER_PAGE = 15; // 1개 쪽당 최대 줄 수 (좌우 합쳐서 30줄)
        const LINES_PER_SPREAD = LINES_PER_PAGE * 2; // 펼친 2쪽당 30줄

        document.addEventListener("DOMContentLoaded", function() {
            loadAppTitle();
            initBooks();

            document.getElementById("memoInput").addEventListener("keydown", function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    addMemo();
                }
            });

            // 좌우 방향키로 페이지 넘기기
            document.addEventListener("keydown", function(e) {
                if (document.activeElement.id === 'memoInput' || document.activeElement.classList.contains('edit-editor')) return;
                if (e.key === 'ArrowLeft') prevPage();
                if (e.key === 'ArrowRight') nextPage();
            });
        });

        function loadAppTitle() {
            const savedTitle = localStorage.getItem("myNotebook_appTitle");
            if (savedTitle) {
                document.getElementById("appTitle").innerText = savedTitle;
                document.title = savedTitle;
            }
        }

        function changeAppTitle() {
            const currentTitle = document.getElementById("appTitle").innerText;
            const newTitle = prompt("메인 제목을 입력하세요:", currentTitle);
            if (newTitle && newTitle.trim()) {
                const trimmed = newTitle.trim();
                document.getElementById("appTitle").innerText = trimmed;
                document.title = trimmed;
                localStorage.setItem("myNotebook_appTitle", trimmed);
            }
        }

        function getAllBooks() {
            const saved = localStorage.getItem("myNotebook_books");
            if (!saved) return { "default": { title: "기본 공책", memos: [] } };
            return JSON.parse(saved);
        }

        function saveAllBooks(books) {
            localStorage.setItem("myNotebook_books", JSON.stringify(books));
        }

        function initBooks() {
            const books = getAllBooks();
            if (!books[currentBookId]) {
                currentBookId = Object.keys(books)[0] || "default";
            }
            renderBookList();
            renderMemos();
        }

        function createNewBook() {
            const title = prompt("새 공책의 이름을 입력하세요:", "새 공책");
            if (!title || !title.trim()) return;

            const books = getAllBooks();
            const newId = "book_" + Date.now();
            books[newId] = { title: title.trim(), memos: [] };
            saveAllBooks(books);

            currentBookId = newId;
            currentPageGroup = 0;
            renderBookList();
            renderMemos();
        }

        function switchBook(bookId) {
            currentBookId = bookId;
            currentEditingIndex = -1;
            currentPageGroup = 0;
            renderBookList();
            renderMemos();
        }

        function deleteBook(bookId, event) {
            event.stopPropagation();
            const books = getAllBooks();
            if (Object.keys(books).length <= 1) {
                alert("최소 하나의 공책은 남아있어야 합니다.");
                return;
            }

            if (confirm(`'${books[bookId].title}' 공책을 삭제하시겠습니까?`)) {
                delete books[bookId];
                saveAllBooks(books);
                if (currentBookId === bookId) currentBookId = Object.keys(books)[0];
                currentPageGroup = 0;
                renderBookList();
                renderMemos();
            }
        }

        function renderBookList() {
            const books = getAllBooks();
            const list = document.getElementById("bookList");
            list.innerHTML = "";

            Object.keys(books).forEach(id => {
                const book = books[id];
                const li = document.createElement("li");
                li.className = `book-item ${id === currentBookId ? 'active' : ''}`;
                li.onclick = () => switchBook(id);
                li.innerHTML = `
                    <span class="book-name">📖 ${book.title}</span>
                    <button class="book-del-btn" onclick="deleteBook('${id}', event)">✕</button>
                `;
                list.appendChild(li);
            });

            document.getElementById("notebookTitle").innerText = `📝 ${books[currentBookId].title}`;
        }

        function getSavedMemos() {
            const books = getAllBooks();
            return books[currentBookId] ? books[currentBookId].memos : [];
        }

        function saveMemos(memos) {
            const books = getAllBooks();
            if (books[currentBookId]) {
                books[currentBookId].memos = memos;
                saveAllBooks(books);
            }
        }

        // 서식 기능
        function applyStyle(className) {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;

            const range = selection.getRangeAt(0);
            const span = document.createElement("span");
            span.className = className;
            span.textContent = range.toString();

            range.deleteContents();
            range.insertNode(span);
            selection.removeAllRanges();
        }

        function clearStyle(type) {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;

            const range = selection.getRangeAt(0);
            const container = range.commonAncestorContainer.parentElement;

            if (container && container.tagName === 'SPAN') {
                if (type === 'highlight' && (container.classList.contains('hl-y') || container.classList.contains('hl-g') || container.classList.contains('hl-p'))) {
                    removeSpanKeepText(container);
                } else if (type === 'underline' && container.classList.contains('style-red-ul')) {
                    removeSpanKeepText(container);
                }
            }
            selection.removeAllRanges();
        }

        function removeSpanKeepText(spanElement) {
            const textNode = document.createTextNode(spanElement.textContent);
            spanElement.parentNode.replaceChild(textNode, spanElement);
        }

        // 메모 추가 (2쪽 차면 자동으로 마지막 페이지로 이동 후 추가)
        function addMemo() {
            if (currentEditingIndex !== -1) {
                saveEdit(currentEditingIndex);
            }

            const input = document.getElementById("memoInput");
            let htmlContent = input.innerHTML.trim();
            
            if (!htmlContent || htmlContent === '<br>') return;

            htmlContent = htmlContent.replace(/<div>/gi, '<br>').replace(/<\/div>/gi, '')
                                     .replace(/<p>/gi, '<br>').replace(/<\/p>/gi, '');

            const lines = htmlContent.split(/<br\s*[\/]?>/gi);
            const memos = getSavedMemos();

            lines.forEach(line => {
                const cleanedLine = line.trim();
                memos.push(cleanedLine === '' || cleanedLine === '&nbsp;' ? '&nbsp;' : cleanedLine);
            });

            saveMemos(memos);
            input.innerHTML = "";

            // 새로 추가 후 자동으로 맨 마지막 작성 페이지로 이동
            currentPageGroup = Math.floor((memos.length - 1) / LINES_PER_SPREAD);
            if (currentPageGroup < 0) currentPageGroup = 0;

            renderMemos();
        }

        function deleteMemo(index) {
            const memos = getSavedMemos();
            memos.splice(index, 1);
            saveMemos(memos);
            if (currentEditingIndex === index) currentEditingIndex = -1;

            // 페이지 범위 벗어남 방지
            const maxPage = Math.max(0, Math.ceil(memos.length / LINES_PER_SPREAD) - 1);
            if (currentPageGroup > maxPage) currentPageGroup = maxPage;

            renderMemos();
        }

        function deleteSelectedMemos() {
            const checkboxes = document.querySelectorAll(".memo-checkbox:checked");
            if (checkboxes.length === 0) {
                alert("삭제할 항목을 선택해주세요.");
                return;
            }

            if (!confirm(`선택한 ${checkboxes.length}개 항목을 삭제하시겠습니까?`)) return;

            const indexesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index));
            let memos = getSavedMemos();

            indexesToDelete.sort((a, b) => b - a);
            indexesToDelete.forEach(index => memos.splice(index, 1));

            saveMemos(memos);
            currentEditingIndex = -1;

            const maxPage = Math.max(0, Math.ceil(memos.length / LINES_PER_SPREAD) - 1);
            if (currentPageGroup > maxPage) currentPageGroup = maxPage;

            renderMemos();
        }

        function clearAllMemos() {
            const memos = getSavedMemos();
            if (memos.length === 0) return;

            if (confirm("현재 공책의 모든 메모를 삭제하시겠습니까?")) {
                saveMemos([]);
                currentEditingIndex = -1;
                currentPageGroup = 0;
                renderMemos();
            }
        }

        function editMemo(index) {
            if (currentEditingIndex === index) return;
            if (currentEditingIndex !== -1) saveEdit(currentEditingIndex);
            currentEditingIndex = index;
            renderMemos();
        }

        function saveEdit(index) {
            const editInput = document.getElementById(`editInput-${index}`);
            if (!editInput) return;
            
            let newHtml = editInput.innerHTML.trim();
            const memos = getSavedMemos();

            if (!newHtml || newHtml === '<br>') newHtml = '&nbsp;';

            memos[index] = newHtml;
            saveMemos(memos);
            currentEditingIndex = -1;
            renderMemos();
        }

        function prevPage() {
            if (currentPageGroup > 0) {
                currentPageGroup--;
                renderMemos();
            }
        }

        function nextPage() {
            const memos = getSavedMemos();
            const maxPageGroup = Math.ceil(memos.length / LINES_PER_SPREAD);
            if (currentPageGroup < maxPageGroup) {
                currentPageGroup++;
                renderMemos();
            }
        }

        function createMemoLi(itemHtml, index) {
            const li = document.createElement("li");
            li.className = "memo-item";
            li.id = `memo-${index}`;

            if (index === currentEditingIndex) {
                const displayValue = (itemHtml === '&nbsp;') ? '' : itemHtml;
                li.innerHTML = `
                    <div class="edit-box">
                        <div class="edit-editor" id="editInput-${index}" contenteditable="true">${displayValue}</div>
                        <button class="delete-btn" onclick="saveEdit(${index})" style="font-size:16px;">✔</button>
                    </div>
                `;
                setTimeout(() => {
                    const editInput = document.getElementById(`editInput-${index}`);
                    if (editInput) editInput.focus();
                }, 0);
            } else {
                const isBlank = (itemHtml === '&nbsp;');
                const contentDisplay = isBlank ? '' : itemHtml;
                li.innerHTML = `
                    <input type="checkbox" class="memo-checkbox" data-index="${index}">
                    <div class="memo-content" onclick="editMemo(${index})" title="클릭해서 수정">${contentDisplay}</div>
                    <button class="delete-btn" onclick="deleteMemo(${index})">✕</button>
                `;
            }
            return li;
        }

        function renderMemos() {
            const leftList = document.getElementById("memoListLeft");
            const rightList = document.getElementById("memoListRight");
            leftList.innerHTML = "";
            rightList.innerHTML = "";

            const memos = getSavedMemos();
            const keyword = document.getElementById("searchInput").value.toLowerCase();

            // 검색 중일 때는 전체 검색 결과 노출
            if (keyword) {
                document.getElementById("pageIndicator").innerText = "검색 결과";
                document.getElementById("prevPageBtn").disabled = true;
                document.getElementById("nextPageBtn").disabled = true;

                let visibleIndex = 0;
                memos.forEach((itemHtml, index) => {
                    const tempDiv = document.createElement("div");
                    tempDiv.innerHTML = itemHtml;
                    if (!tempDiv.textContent.toLowerCase().includes(keyword)) return;

                    const li = createMemoLi(itemHtml, index);
                    if (visibleIndex < LINES_PER_PAGE) leftList.appendChild(li);
                    else rightList.appendChild(li);
                    visibleIndex++;
                });
                return;
            }

            // 페이지 수 표시 업데이트
            const leftPageNum = currentPageGroup * 2 + 1;
            const rightPageNum = currentPageGroup * 2 + 2;
            document.getElementById("pageIndicator").innerText = `Page ${leftPageNum} - ${rightPageNum}`;

            // 버튼 활성화/비활성화
            document.getElementById("prevPageBtn").disabled = (currentPageGroup === 0);
            
            const totalPageGroups = Math.ceil(memos.length / LINES_PER_SPREAD);
            // 메모가 딱 다 찼거나 작성 중인 경우에도 다음 페이지 넘김 가능
            document.getElementById("nextPageBtn").disabled = (currentPageGroup > totalPageGroups);

            // 현재 페이지 그룹에 해당하는 메목 항목 가져오기
            const startIndex = currentPageGroup * LINES_PER_SPREAD;
            const endIndex = startIndex + LINES_PER_SPREAD;
            const currentMemos = memos.slice(startIndex, endIndex);

            currentMemos.forEach((itemHtml, relativeIndex) => {
                const actualIndex = startIndex + relativeIndex;
                const li = createMemoLi(itemHtml, actualIndex);

                if (relativeIndex < LINES_PER_PAGE) {
                    leftList.appendChild(li);
                } else {
                    rightList.appendChild(li);
                }
            });
        }
    </script>
</body>
</html>
